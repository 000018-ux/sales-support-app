<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>営業支援ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{padding:10px 4px 16px}.top h1{font-size:30px;margin:0 0 5px}.sub{color:#68707a;font-size:13px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;background:#fff;border-radius:18px;padding:20px 16px;text-align:left;box-shadow:0 2px 12px #0001;min-height:118px}.tile .icon{font-size:30px}.tile b{display:block;font-size:18px;margin-top:9px}.tile span{display:block;color:#68707a;font-size:12px;margin-top:4px}.screen{display:none}.screen.active{display:block}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{width:auto;margin:0;background:#555;padding:0 17px;height:44px;font-size:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;height:50px;border:1px solid #c8ccd2;border-radius:11px;padding:0 12px;font-size:19px;background:#fff}input.source{border:2px solid #222;background:#fffdf0}button{border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:700;height:50px;padding:0 18px}.wide{width:100%;margin-top:14px}.result{margin-top:12px;padding:13px;border-radius:12px;background:#f5f6f7;line-height:1.6}.warn{background:#fff7df;border:1px solid #ead38a}.note{font-size:12px;line-height:1.65;color:#606875}.title{font-size:24px;margin:0}.placeholder{color:#68707a;line-height:1.7}.small{font-size:12px;color:#68707a}
</style></head><body><div class="wrap">
<section id="home" class="screen active"><div class="top"><h1>営業支援ツール</h1><div class="sub">現場で使う情報を、ひとつに。</div></div><div class="menu"><button class="tile" onclick="show('hardness')"><div class="icon">🔧</div><b>硬度換算</b><span>HV・HRC・HRB・HB・HRA</span></button><button class="tile" onclick="show('material')"><div class="icon">🧱</div><b>材質・熱処理</b><span>材料と処理状態の参考情報</span></button><button class="tile" onclick="show('memo')"><div class="icon">📝</div><b>商談メモ</b><span>次回の確認事項を記録</span></button><button class="tile" onclick="show('future')"><div class="icon">📚</div><b>規格・資料</b><span>今後追加予定</span></button></div></section>
<section id="hardness" class="screen"><div class="head"><button class="back" onclick="show('home')">← 戻る</button><h2 class="title">硬度換算</h2></div><div class="card"><div class="grid"><div><label>HV</label><input id="HV" type="number" inputmode="decimal" step="any"></div><div><label>HRC</label><input id="HRC" type="number" inputmode="decimal" step="any"></div><div><label>HRB</label><input id="HRB" type="number" inputmode="decimal" step="any"></div><div><label>HB</label><input id="HB" type="number" inputmode="decimal" step="any"></div><div><label>HRA</label><input id="HRA" type="number" inputmode="decimal" step="any"></div><div><label>HS</label><input id="HS" type="number" inputmode="decimal" step="any"></div></div><button id="clear" class="wide">クリア</button><div id="status" class="result">入力してください。</div></div><div class="card warn"><b>データの扱い</b><p class="note">換算データはシリコロイ ラボ「硬度換算表」を参考にしたテスト版です。同ページは換算表をSAE J417から抜粋したものと説明しています。本アプリはISO 18265準拠表ではありません。</p><p class="note">正式な品質保証・検査判定では原規格・原表を確認してください。HSは自動換算しません。</p></div></section>
<section id="material" class="screen"><div class="head"><button class="back" onclick="show('home')">← 戻る</button><h2 class="title">材質・熱処理</h2></div><div class="card"><div class="grid"><div><label>材質</label><select id="mat"><option value="">選択してください</option><option>S45C</option><option>SCM435</option><option>SCM440</option><option>SS400</option><option>SUS304</option><option>SKD11</option></select></div><div><label>熱処理等</label><select id="heat"><option value="">選択してください</option><option>焼鈍</option><option>焼ならし</option><option>焼入れ</option><option>焼入れ・焼戻し</option><option>調質</option><option>冷間加工</option><option>未処理</option></select></div></div><div id="matout" class="result">材質と熱処理等を選ぶと参考硬度を表示します。</div></div></section>
<section id="memo" class="screen"><div class="head"><button class="back" onclick="show('home')">← 戻る</button><h2 class="title">商談メモ</h2></div><div class="card"><label>メモ</label><textarea id="memoText" style="width:100%;min-height:220px;border:1px solid #c8ccd2;border-radius:11px;padding:12px;font-size:17px"></textarea><button class="wide" onclick="saveMemo()">保存</button><div id="saved" class="result">この端末に保存します。</div></div></section>
<section id="future" class="screen"><div class="head"><button class="back" onclick="show('home')">← 戻る</button><h2 class="title">規格・資料</h2></div><div class="card"><p class="placeholder">ここに今後、規格検索・資料・カタログ・社内基準などを追加できます。</p></div></section>
</div>
<script>
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
const data=[{HV:100,HRA:null,HRB:56.2,HRC:null,HB:95},{HV:120,HRA:null,HRB:66.7,HRC:null,HB:114},{HV:140,HRA:null,HRB:75,HRC:null,HB:133},{HV:160,HRA:null,HRB:81.7,HRC:0,HB:152},{HV:180,HRA:null,HRB:87.1,HRC:6,HB:171},{HV:200,HRA:null,HRB:91.5,HRC:11,HB:190},{HV:220,HRA:null,HRB:95,HRC:15.7,HB:209},{HV:240,HRA:60.7,HRB:98.1,HRC:20.3,HB:228},{HV:250,HRA:61.6,HRB:99.5,HRC:22.2,HB:238},{HV:260,HRA:62.4,HRB:101,HRC:24,HB:247},{HV:270,HRA:63.1,HRB:102,HRC:25.6,HB:256},{HV:280,HRA:63.8,HRB:103.5,HRC:27.1,HB:265},{HV:290,HRA:64.5,HRB:104.5,HRC:28.5,HB:275},{HV:300,HRA:65.2,HRB:105.5,HRC:29.8,HB:284},{HV:320,HRA:66.4,HRB:107,HRC:32.2,HB:303},{HV:340,HRA:67.6,HRB:108,HRC:34.4,HB:322},{HV:360,HRA:68.7,HRB:109,HRC:36.6,HB:341},{HV:380,HRA:69.8,HRB:110,HRC:38.8,HB:360},{HV:400,HRA:70.8,HRB:null,HRC:40.8,HB:379},{HV:420,HRA:71.8,HRB:null,HRC:42.7,HB:397},{HV:440,HRA:72.8,HRB:null,HRC:44.5,HB:415},{HV:460,HRA:73.6,HRB:null,HRC:46.1,HB:433},{HV:480,HRA:74.5,HRB:null,HRC:47.7,HB:452},{HV:500,HRA:75.3,HRB:null,HRC:49.1,HB:471},{HV:530,HRA:76.4,HRB:null,HRC:51.1,HB:497},{HV:550,HRA:77,HRB:null,HRC:52.3,HB:517},{HV:570,HRA:77.8,HRB:null,HRC:53.6,HB:535},{HV:600,HRA:78.8,HRB:null,HRC:54.8,HB:571},{HV:650,HRA:80,HRB:null,HRC:57.8,HB:611},{HV:680,HRA:80.8,HRB:null,HRC:59.2,HB:638},{HV:700,HRA:81.3,HRB:null,HRC:60.1,HB:656},{HV:740,HRA:82.2,HRB:null,HRC:61.8,HB:684},{HV:800,HRA:83.4,HRB:null,HRC:64,HB:722},{HV:860,HRA:84.4,HRB:null,HRC:65.9,HB:757},{HV:900,HRA:85,HRB:null,HRC:67,HB:795}];
const scales=['HV','HRC','HRB','HB','HRA'], f=Object.fromEntries(scales.map(s=>[s,document.getElementById(s)]));function ok(x){return x!==null&&Number.isFinite(Number(x))}function interpHV(key,v){let a=data.filter(r=>ok(r[key])).sort((x,y)=>x[key]-y[key]);if(!a.length||v<a[0][key]||v>a[a.length-1][key])return null;for(let i=0;i<a.length;i++){if(v===a[i][key])return a[i].HV;if(i&&v<a[i][key]){let p=a[i-1],q=a[i];return p.HV+(q.HV-p.HV)*(v-p[key])/(q[key]-p[key])}}return null}function fromHV(hv,key){let a=data.filter(r=>ok(r[key])).sort((x,y)=>x.HV-y.HV);if(!a.length||hv<a[0].HV||hv>a[a.length-1].HV)return null;for(let i=0;i<a.length;i++){if(hv===a[i].HV)return a[i][key];if(i&&hv<a[i].HV){let p=a[i-1],q=a[i];return p[key]+(q[key]-p[key])*(hv-p.HV)/(q.HV-p.HV)}}return null}function fmt(x,key){if(x===null)return '';return ['HRC','HRA','HRB'].includes(key)?Number(x).toFixed(1):String(Math.round(x))}let busy=false;scales.forEach(s=>f[s].addEventListener('input',()=>{if(busy)return;let v=Number(f[s].value);scales.forEach(t=>{if(t!==s)f[t].value='';f[t].classList.toggle('source',t===s)});if(!Number.isFinite(v)){status.textContent='入力してください。';return}let hv=s==='HV'?v:interpHV(s,v);if(hv===null){status.textContent='この値は換算データの範囲外、または対応データがありません。';return}busy=true;scales.forEach(t=>{if(t!==s)f[t].value=fmt(fromHV(hv,t),t)});busy=false;status.textContent='公開表の代表点を直線補間して表示しています。'}));clear.onclick=()=>{scales.forEach(s=>{f[s].value='';f[s].classList.remove('source')});HS.value='';status.textContent='入力してください。'};
const ref={'S45C':{'焼鈍':'HB 約180以下','焼ならし':'HB 約167～229','焼入れ':'HRC 約50～60','焼入れ・焼戻し':'HRC 約28～50','調質':'HB 約200～260','冷間加工':'状態により変化','未処理':'HB 約170～220'},'SCM435':{'焼鈍':'HB 約200～240','焼ならし':'HB 約180～230','焼入れ':'HRC 約50～60','焼入れ・焼戻し':'HRC 約28～50','調質':'HB 約250～300','冷間加工':'状態により変化','未処理':'HB 約200～250'},'SCM440':{'焼鈍':'HB 約200～240','焼ならし':'HB 約190～240','焼入れ':'HRC 約50～60','焼入れ・焼戻し':'HRC 約28～52','調質':'HB 約250～320','冷間加工':'状態により変化','未処理':'HB 約200～260'},'SS400':{'焼鈍':'HB 約120～180','焼ならし':'HB 約120～180','焼入れ':'—','焼入れ・焼戻し':'—','調質':'—','冷間加工':'状態により変化','未処理':'HB 約120～180'},'SUS304':{'焼鈍':'HB 約150～190','焼ならし':'—','焼入れ':'—','焼入れ・焼戻し':'—','調質':'—','冷間加工':'加工度により上昇','未処理':'HB 約150～190'},'SKD11':{'焼鈍':'HB 約200～250','焼ならし':'—','焼入れ':'HRC 約58～62','焼入れ・焼戻し':'HRC 約58～62','調質':'HRC 約58～62','冷間加工':'—','未処理':'HB 約200～250'}};function matUpdate(){let m=mat.value,h=heat.value;if(!m||!h){matout.textContent='材質と熱処理等を選ぶと参考硬度を表示します。';return}matout.innerHTML='<b>'+m+' / '+h+'</b><br>参考硬度： '+(ref[m][h]||'データ未設定')+'<div class="note">※参考値です。実測値・材料仕様・図面要求を優先してください。</div>'}mat.onchange=matUpdate;heat.onchange=matUpdate;
function saveMemo(){localStorage.setItem('salesMemo',memoText.value);saved.textContent='保存しました。'}memoText.value=localStorage.getItem('salesMemo')||'';
</script></body></html>
